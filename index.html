<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <script>
    // Resolve the theme before first paint so a dark-mode user never sees a
    // flash of the light theme. Mirrors the resolution order in App.tsx:
    // a saved preference wins, otherwise fall back to the OS setting.
    // Kept inline and dependency-free on purpose — a module import would run
    // after paint and reintroduce the flash.
    (function () {
      try {
        var saved = localStorage.getItem('darkMode');
        var dark = saved !== null
          ? JSON.parse(saved)
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', !!dark);
      } catch (e) {
        /* private mode / storage disabled — fall through to light */
      }
    })();
  </script>
  <!-- "Show it. Build it. Ship it." is the tagline and lives in the hero and the
       header lockup. These slots carry the *descriptor* instead: they are read by
       search engines and link-preview scrapers, neither of which has the hero's
       lede underneath to explain what "show it" means. Keep the wording in sync
       with LandingPage's lede, which is where it was lifted from. -->
  <title>Forma — Screenshot to DevExpress .repx</title>
  <meta name="description"
    content="Upload a screenshot, a PDF, or an existing .repx. Forma returns a written spec, a live mockup, and valid DevExpress XML you can open in the designer." />

  <!-- Link previews. og:image is root-relative on purpose: the Open Graph spec
       asks for an absolute URL, but the only host value this project has is
       APP_URL in .env, which is NOT VITE_-prefixed and therefore never reaches
       the client (vite.config.ts allowlists VITE_* only). Baking in a literal
       host would be wrong on every other deployment, and Vite's %VITE_*% HTML
       replacement leaves the placeholder text in the output when the variable is
       unset — a visibly broken URL. Root-relative resolves correctly against the
       page origin in Slack, Facebook, X and LinkedIn, and degrades to no preview
       image rather than a wrong one.

       The image is /og-card.png, a purpose-built 1200x630 card — not the square
       logo, which the large-image layouts letterboxed. It is generated from
       assets/source/og-card.html; see CLAUDE.md for the regeneration command and
       the checks it gates on. Declaring og:image:width/height lets a scraper lay
       out the card before it has finished downloading it, and twitter:card is
       "summary_large_image" because there is now an asset with the right aspect
       ratio to fill it. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Forma" />
  <meta property="og:title" content="Forma — Screenshot to DevExpress .repx" />
  <meta property="og:description"
    content="Upload a screenshot, a PDF, or an existing .repx. Forma returns a written spec, a live mockup, and valid DevExpress XML you can open in the designer." />
  <meta property="og:image" content="/og-card.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="Forma — Show it. Build it. Ship it. Screenshot, PDF or .repx to DevExpress .repx." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Forma — Screenshot to DevExpress .repx" />
  <meta name="twitter:description"
    content="Upload a screenshot, a PDF, or an existing .repx. Forma returns a written spec, a live mockup, and valid DevExpress XML you can open in the designer." />
  <meta name="twitter:image" content="/og-card.png" />
  <meta name="twitter:image:alt"
    content="Forma — Show it. Build it. Ship it. Screenshot, PDF or .repx to DevExpress .repx." />
  <!-- Font Families: Hanken Grotesk, Inter, JetBrains Mono -->
  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap"
    rel="stylesheet" />
  <!-- Material Symbols Outlined -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
