<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Its own file, and 32x32 on purpose. This used to point at /logo.png, the
       256x256 <picture> fallback, which meant 38,075 bytes fetched before any
       component code runs to be drawn at sixteen pixels in a tab strip. The
       downscale is 1,406 bytes. 32 rather than 16 so a 2x strip has real pixels
       to use; PNG rather than WebP because favicon WebP support is still patchy
       and this is the one request that cannot afford a fallback. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="alternate" type="application/atom+xml" title="Forma changelog" href="/changelog.xml" />
  <!-- The installable app and the home-screen icon (2026-11-08, site audit
       item 74): public/manifest.webmanifest and the icons scripts/make-icons.mjs
       draws from public/logo.png. theme-color tints the browser's own bar to the
       page's background, light and dark as index.css has them. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#FCFCFC" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090D14" media="(prefers-color-scheme: dark)" />
  <!-- Each page's own head is written in at build (src/lib/seo.ts, `withHead`):
       this file is the home page's. The canonical address names one of the four
       hosts that serve the site (site audit item 37), and robots is per page. -->
  <link rel="canonical" href="https://openforma.web.app/" />
  <meta name="robots" content="index, follow" />
  <!-- For a reader whose browser runs no script (2026-11-11, full audit PS-13):
       anything the built page still draws at the start of an animation is shown
       at its end. The build draws Reveal's blocks visible already
       (src/prerender.tsx); this catches whatever else starts hidden. A style,
       not a script, so the theme script's CSP hash is untouched. -->
  <noscript><style>.landing [style*="opacity:0"]{opacity:1!important;transform:none!important}</style></noscript>
  <script>
    // Resolve the theme before first paint so a dark-mode user never sees a
    // flash of the light theme. Mirrors the resolution order in App.tsx:
    // a saved preference wins, otherwise fall back to the OS setting.
    // Kept inline and dependency-free on purpose — a module import would run
    // after paint and reintroduce the flash.
    (function () {
      try {
        var saved = localStorage.getItem('darkMode');
        var dark = saved !== null
          ? JSON.parse(saved)
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', !!dark);
      } catch (e) {
        /* private mode / storage disabled — fall through to light */
      }
    })();
  </script>
  <!-- "Show it. Build it. Ship it." is the tagline and lives in the hero and the
       header lockup. These slots carry the *descriptor* instead: they are read by
       search engines and link-preview scrapers, neither of which has the hero's
       lede underneath to explain what "show it" means. Keep the wording in sync
       with LandingPage's lede, which is where it was lifted from. Rewritten on
       2026-11-11 (full audit PS-10): it still said "screenshot to .repx" and put
       a written spec first, months after a description became an input and the
       .repx the one thing the AI writes. The same sentence is the manifest's,
       ROUTE_DESCRIPTIONS['/'] in src/lib/seo.ts (the JSON-LD and llms.txt read
       it there) and the title is ROUTE_TITLES['/'], which routes.test holds to
       this file. -->
  <title>Forma — DevExpress reports from a picture, a PDF or your words</title>
  <meta name="description"
    content="Turn a picture, a PDF, a .repx or a few sentences into a DevExpress report you can open in the designer, with a print preview, exports and a chat that edits it. Free, in your browser, with your own Gemini key." />

  <!-- Link previews. og:image is an absolute URL, as the Open Graph spec asks
       (2026-11-08, site audit item 37). It was root-relative until then, on the
       reasoning that no host value reached the client; the site now names one
       canonical origin, SITE_ORIGIN in src/lib/seo.ts, which a fork deploying
       elsewhere changes there and here. Some scrapers (WhatsApp, older
       LinkedIn) do not resolve a relative image at all.

       The image is /og-card.png, a purpose-built 1200x630 card — not the square
       logo, which the large-image layouts letterboxed. It is generated from
       assets/source/og-card.html; see CLAUDE.md for the regeneration command and
       the checks it gates on. Declaring og:image:width/height lets a scraper lay
       out the card before it has finished downloading it, and twitter:card is
       "summary_large_image" because there is now an asset with the right aspect
       ratio to fill it. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Forma" />
  <meta property="og:title" content="Forma — DevExpress reports from a picture, a PDF or your words" />
  <meta property="og:description"
    content="Turn a picture, a PDF, a .repx or a few sentences into a DevExpress report you can open in the designer, with a print preview, exports and a chat that edits it. Free, in your browser, with your own Gemini key." />
  <meta property="og:url" content="https://openforma.web.app/" />
  <meta property="og:image" content="https://openforma.web.app/og-card.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="Forma — Show it. Build it. Ship it. Picture, PDF, .repx or words to DevExpress .repx." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Forma — DevExpress reports from a picture, a PDF or your words" />
  <meta name="twitter:description"
    content="Turn a picture, a PDF, a .repx or a few sentences into a DevExpress report you can open in the designer, with a print preview, exports and a chat that edits it. Free, in your browser, with your own Gemini key." />
  <meta name="twitter:image" content="https://openforma.web.app/og-card.png" />
  <meta name="twitter:image:alt"
    content="Forma — Show it. Build it. Ship it. Picture, PDF, .repx or words to DevExpress .repx." />
  <!-- Font Families: Hanken Grotesk, Inter, JetBrains Mono. Three <link> tags
       lived here — two preconnects and a render-blocking stylesheet on
       fonts.googleapis.com — until 2026-08-30, when the faces were self-hosted
       and audit PERF-002 closed.

       There is deliberately nothing to replace them with. The @font-face rules
       live in src/index.css, which is already loaded by the bundle, so the
       fonts need no markup here and no preconnect: they come from this origin,
       on the connection that fetched the page. A preload hint is the one
       addition worth having, and it is not written here because it has to name
       a Vite-fingerprinted filename that changes every build: since 2026-11-11
       (full audit PR-21) the build writes it into each public page's head
       instead (vite.config.ts, `pagesAndCrawlers`).

       The reasoning that used to sit here, including the measured weight lists
       and why they are what they are, moved to src/index.css next to the rules
       it now governs. Read it there before changing a weight. -->

  <!-- The Material Symbols stylesheet was here until 2026-08-27. It pulled a
       variable icon font across its full weight and fill axes to draw five
       glyphs — menu, close, logout and a chevron pair — and three of those
       already existed as inline SVGs in components/landing/icons.tsx, which
       every other icon in the app comes from. Two render-blocking requests to a
       third-party origin, for something the project already had. Removed; do
       not add it back for one more icon, add the icon. (Audit PERF-002.) -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
