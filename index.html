<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Its own file, and 32x32 on purpose. This used to point at /logo.png, the
       256x256 <picture> fallback, which meant 38,075 bytes fetched before any
       component code runs to be drawn at sixteen pixels in a tab strip. The
       downscale is 1,406 bytes. 32 rather than 16 so a 2x strip has real pixels
       to use; PNG rather than WebP because favicon WebP support is still patchy
       and this is the one request that cannot afford a fallback. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <script>
    // Resolve the theme before first paint so a dark-mode user never sees a
    // flash of the light theme. Mirrors the resolution order in App.tsx:
    // a saved preference wins, otherwise fall back to the OS setting.
    // Kept inline and dependency-free on purpose — a module import would run
    // after paint and reintroduce the flash.
    (function () {
      try {
        var saved = localStorage.getItem('darkMode');
        var dark = saved !== null
          ? JSON.parse(saved)
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', !!dark);
      } catch (e) {
        /* private mode / storage disabled — fall through to light */
      }
    })();
  </script>
  <!-- "Show it. Build it. Ship it." is the tagline and lives in the hero and the
       header lockup. These slots carry the *descriptor* instead: they are read by
       search engines and link-preview scrapers, neither of which has the hero's
       lede underneath to explain what "show it" means. Keep the wording in sync
       with LandingPage's lede, which is where it was lifted from. -->
  <title>Forma — Screenshot to DevExpress .repx</title>
  <meta name="description"
    content="Upload a screenshot, a PDF, or an existing .repx. Forma returns a written spec, a live mockup, and valid DevExpress XML you can open in the designer." />

  <!-- Link previews. og:image is root-relative on purpose: the Open Graph spec
       asks for an absolute URL, but the only host value this project has is
       APP_URL in .env, which is NOT VITE_-prefixed and therefore never reaches
       the client (vite.config.ts allowlists VITE_* only). Baking in a literal
       host would be wrong on every other deployment, and Vite's HTML variable
       replacement (percent-VITE_NAME-percent, written out because writing it
       literally makes Vite warn on every single build about a variable this
       comment is explaining we do NOT use — audit RUN-001) leaves the
       placeholder text in the output when the variable is
       unset — a visibly broken URL. Root-relative resolves correctly against the
       page origin in Slack, Facebook, X and LinkedIn, and degrades to no preview
       image rather than a wrong one.

       The image is /og-card.png, a purpose-built 1200x630 card — not the square
       logo, which the large-image layouts letterboxed. It is generated from
       assets/source/og-card.html; see CLAUDE.md for the regeneration command and
       the checks it gates on. Declaring og:image:width/height lets a scraper lay
       out the card before it has finished downloading it, and twitter:card is
       "summary_large_image" because there is now an asset with the right aspect
       ratio to fill it. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Forma" />
  <meta property="og:title" content="Forma — Screenshot to DevExpress .repx" />
  <meta property="og:description"
    content="Upload a screenshot, a PDF, or an existing .repx. Forma returns a written spec, a live mockup, and valid DevExpress XML you can open in the designer." />
  <meta property="og:image" content="/og-card.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="Forma — Show it. Build it. Ship it. Screenshot, PDF or .repx to DevExpress .repx." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Forma — Screenshot to DevExpress .repx" />
  <meta name="twitter:description"
    content="Upload a screenshot, a PDF, or an existing .repx. Forma returns a written spec, a live mockup, and valid DevExpress XML you can open in the designer." />
  <meta name="twitter:image" content="/og-card.png" />
  <meta name="twitter:image:alt"
    content="Forma — Show it. Build it. Ship it. Screenshot, PDF or .repx to DevExpress .repx." />
  <!-- Font Families: Hanken Grotesk, Inter, JetBrains Mono. Three <link> tags
       lived here — two preconnects and a render-blocking stylesheet on
       fonts.googleapis.com — until 2026-08-30, when the faces were self-hosted
       and audit PERF-002 closed.

       There is deliberately nothing to replace them with. The @font-face rules
       live in src/index.css, which is already loaded by the bundle, so the
       fonts need no markup here and no preconnect: they come from this origin,
       on the connection that fetched the page. A preload hint would be the one
       arguable addition, and it is left out on purpose — it would have to name
       a Vite-fingerprinted filename that changes every build.

       The reasoning that used to sit here, including the measured weight lists
       and why they are what they are, moved to src/index.css next to the rules
       it now governs. Read it there before changing a weight. -->

  <!-- The Material Symbols stylesheet was here until 2026-08-27. It pulled a
       variable icon font across its full weight and fill axes to draw five
       glyphs — menu, close, logout and a chevron pair — and three of those
       already existed as inline SVGs in components/landing/icons.tsx, which
       every other icon in the app comes from. Two render-blocking requests to a
       third-party origin, for something the project already had. Removed; do
       not add it back for one more icon, add the icon. (Audit PERF-002.) -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
