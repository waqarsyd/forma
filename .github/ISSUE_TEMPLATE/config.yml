# Blank issues are off so that every report arrives with the detail that makes
# it actionable. The forms alongside this file ask for exactly what the contact
# page has always asked for -- the same triage needs, in the place people
# actually file.
#
# Both links point at waqarsyd/forma. If the repository is ever renamed or
# moved, they break silently -- GitHub renders a dead contact link exactly like a
# live one -- so they are worth re-checking then. `grep -rn github.com .github`
# finds every hardcoded path.
#
# The Discussions link only works once Discussions is enabled for the repository
# (Settings -> General -> Features). Until then it 404s, so enable it or drop
# that entry.
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/waqarsyd/forma/security/advisories/new
    about: >-
      Report it privately, not here. Anything that could expose an API key or
      someone's saved reports belongs in a private advisory. If that link is not
      live yet, email the address in SECURITY.md instead.

  - name: Question, or not sure it is a bug
    url: https://github.com/waqarsyd/forma/discussions
    about: >-
      Ask in Discussions. "Is this supposed to happen?" is a fine question and
      does not need to be an issue first.
