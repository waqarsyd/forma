# CodeQL (2026-11-08, site audit item 92): GitHub's own static analysis of the
# TypeScript, free for a public repository. On every push and pull request to
# main, and weekly, so a new query reaches code that has not changed. Its
# findings appear under the repository's Security tab, not as a failed check:
# this gates nothing, as the REPX audit gates nothing, and the seven checks
# in checks.yml stay the gate.
#
# Actions pinned to commit SHAs with their tags beside them, as in checks.yml;
# Dependabot's weekly github-actions updates move the pins.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # Pinned as checks.yml pins its image (2026-11-11, the full audit, TC-16):
    # `ubuntu-latest` moves to Ubuntu 26, and a failure then names no commit.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
