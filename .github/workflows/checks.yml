# The checks this repository already documents, run by a machine instead of by
# someone remembering.
#
# CLAUDE.md lists seven: tsc, the unused-symbol sweep, the mojibake sweep, the
# doc-pointer sweep, the unit suite, the rules suite, and the bundle-size budget
# after a build. All seven pass and always have. None of them was enforced by
# anything -- there was no CI, no hook, and no remote, so every invariant in the
# project depended on a human running the right command before committing
# (audit INV-003).
#
# (This comment said "five" until 2026-09-06, having been written before
# check:size and lint:links existed. The count is stated in four places --
# here, CLAUDE.md, README.md and CONTRIBUTING.md -- so adding a check is a
# change to all four.)
#
# The whole `checks` job takes well under two minutes, which is the argument for
# running it on every push rather than nightly.
#
# It first executed on 2026-09-09, on the initial push to GitHub, and both jobs
# passed unchanged -- which is the only real test of a workflow written eleven
# days before there was a remote to run it on. That run was also the first time
# this project had been installed, built and tested on Linux rather than on the
# Windows machine it is developed on, and nothing platform-specific surfaced.
#
# ON THE ACTION VERSIONS BELOW
#
# That first run passed but emitted deprecation warnings: checkout, setup-node
# and setup-java were all on majors targeting Node 20, which the runners now
# force onto Node 24, and setup-java v4 is explicitly no longer maintained.
# Bumped to the current majors the same day, each checked against its release
# notes rather than taken on faith -- setup-node v7 drops a dummy NODE_AUTH_TOKEN
# export, which nothing here uses because nothing publishes to a registry, and
# setup-java v6 removes the legacy `adopt` distributions, which is why the pin
# below is `temurin`. Neither affects this file. Majors are pinned rather than
# floated: a moving tag means a green run today and a red one tomorrow for a
# reason found in no commit here.

name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: lint, types, encoding, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 20, 22 and >=24 only: vitest declares ^20 || ^22 || >=24, so the
      # odd lines 21 and 23 are outside the supported range despite being newer
      # than 20. Pinned to the version the project is developed against.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `ci`, not `install`: it installs from the lockfile and fails if
      # package.json and package-lock.json disagree, which is a check in itself
      # and one nothing else performs.
      - run: npm ci

      - name: Typecheck
        run: npm run lint

      # Separate from the typecheck above because it uses stricter flags than
      # tsconfig.json sets. Both baselines are clean, so any output is new.
      - name: Dead code
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters

      # The check with the largest blast radius when skipped: mojibake compiles,
      # passes every test, and is visible only on the rendered page.
      - name: Encoding
        run: npm run lint:encoding

      # The documentation is a router -- CLAUDE.md is short because it points at
      # docs/notes/ and at doc comments. A pointer that has rotted is worse than
      # a stale sentence: a reader follows it, finds nothing, and concludes
      # nothing was written. Added 2026-09-06 after a cited heading was found
      # broken by hand; nothing else in this file would have caught it.
      - name: Doc pointers
        run: npm run lint:links

      # --coverage rather than plain `npm test`: same suite, same pass/fail, and
      # the summary lands in the log so a drop is visible in the diff of a run
      # rather than only when someone thinks to look.
      - name: Unit tests
        run: npm run test:coverage

      # Catches what the tests cannot: a broken import, a Vite plugin failure,
      # or the server bundle failing to resolve a local module.
      - name: Build
        run: npm run build

      # Must follow the build, because it measures dist/. This exists because of
      # a defect every other check here missed: Tailwind was generating utilities
      # from class names quoted in markdown, so the stylesheet grew while tsc was
      # clean, 409 tests passed and the build succeeded. Nothing was watching the
      # size. Commit 0bf3291 carries the measurement.
      - name: Bundle size budget
        run: npm run check:size

  rules:
    name: firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # The Firestore emulator is a JVM process. A runtime is enough -- no JDK
      # is required, which is also how it is installed on the dev machine.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # Its own job because it is the slow one: ~90s, nearly all of it the
      # emulator starting and stopping. Splitting it keeps the fast feedback
      # fast without giving up the coverage -- firestore.rules is the entire
      # security boundary and the entire validation layer for this app.
      - name: Security rules
        run: npm run test:rules
